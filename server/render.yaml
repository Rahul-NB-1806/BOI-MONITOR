services:
  - type: web
    name: boi-monitor-api
    runtime: node
    repo: https://github.com/Rahul-NB-1806/BOI-MONITOR
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: PORT
        value: 10000
